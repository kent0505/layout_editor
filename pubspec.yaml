name: layout_editor
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ###
  flutter_svg: ^2.3.0
  ###
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icons/
    - assets/sounds/

    - assets/icons/animals/
    - assets/icons/eats/
    - assets/icons/flowers/
    - assets/icons/others/
  fonts:
    - family: RubikWetPaint
      fonts:
        - asset: assets/fonts/RubikWetPaint-Regular.ttf
